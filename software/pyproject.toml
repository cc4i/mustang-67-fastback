[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mustang-ai"
version = "3.3.0"
description = "Standalone 3-Tier Autonomous Control, HAL Protocol & Pre-Hardware Verification Stack for the 1:20 1967 Ford Mustang Fastback AI Edition (Radxa Zero 3W + Gemini Robotics ER 2.0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.34.0",
    "livekit>=1.2.0",
    "numpy>=2.2.0",
    "onnxruntime>=1.31.0",
    "pillow>=12.0.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.14.0",
    "sherpa-onnx==1.13.5",
    "sounddevice>=0.5.0",
    "websockets>=17.0",
]

[project.optional-dependencies]
radxa = [
    "opencv-python-headless>=4.8.0; sys_platform == 'linux'",
    "spidev>=3.6; sys_platform == 'linux'",
    "smbus2>=0.4.3; sys_platform == 'linux'",
]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
mustang-ai = "mustang_ai.cli.run_agent:main"
mustang-ai-doctor = "mustang_ai.cli.doctor:main"
mustang-ai-voice-live = "mustang_ai.cli.voice_live:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mustang_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E731"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

